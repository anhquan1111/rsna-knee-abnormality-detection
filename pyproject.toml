[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection - PBL: pipeline DICOM, nhan yeu tu bao cao, danh gia"
requires-python = ">=3.12"

# Ghim theo phien ban da chay that va co so do kem trong tai lieu. Doi phien ban co the
# lam so do khac di - vi du `roc_auc_score` tra `nan` thay vi nem loi la hanh vi cua
# sklearn 1.9.x, va toan bo tai lieu ngay 4 dua tren hanh vi do.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "pydicom==3.0.2",
    "pillow==12.3.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "matplotlib==3.11.2",
    "langdetect==1.0.9",
    # Bo giai nen DICOM: dataset dung nhieu transfer syntax, trong do co JPEG Lossless
    # va JPEG 2000. Thieu chung thi header van doc duoc, chi no loi luc cham `pixel_array`.
    "pylibjpeg==2.1.0",
    "pylibjpeg-libjpeg==2.4.0",
    "pylibjpeg-openjpeg==2.5.0",
]

[project.optional-dependencies]
# Chi can khi tai du lieu tu Kaggle - khong can de chay test hay train tu dac trung da co.
data = ["kaggle==2.2.4"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
